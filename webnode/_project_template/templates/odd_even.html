<!DOCTYPE html>
<html>
<head>
<style>
  body { font-family: 'Inter', sans-serif; background: #0f172a; color: white; display:flex; justify-content:center; align-items:center; height:100vh; margin:0;}
  .card { background: #1e293b; padding: 2rem; border-radius: 12px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5); text-align: center; width: 300px;}
  input { padding: 10px; border-radius: 6px; border: none; outline: none; margin-bottom: 10px; width: 100%; box-sizing: border-box; font-size: 16px; background: #334155; color: white;}
  button { padding: 10px 20px; background: #3b82f6; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; transition: background 0.3s;}
  button:hover { background: #2563eb; }
  .nav { margin-bottom: 20px; display: flex; gap: 10px; justify-content: center;}
  .nav a { color: #94a3b8; text-decoration: none; font-size: 14px; padding: 5px 10px; border-radius: 4px; background: #334155;}
  .nav a:hover { background: #475569; color: white; }
</style>
</head>
<body>
  <div class="card">
    <div class="nav">
      <a href="/odd-even">Odd/Even</a>
      <a href="/prime">Prime</a>
      <a href="/factorial">Factorial</a>
    </div>
    <h2>Odd/Even Checker</h2>
    <form method="GET">
      <input type="number" name="n" placeholder="Enter a number" value="{number}" required>
      <button type="submit">Calculate</button>
    </form>
    <h3 style="margin-top:20px; color:#10b981; word-break: break-all;">{result}</h3>
  </div>
</body>
</html>
