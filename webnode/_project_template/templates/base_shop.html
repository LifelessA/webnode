<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ShopNova{% endblock %} — Premium Store</title>
    <meta name="description" content="ShopNova — Discover premium products at unbeatable prices.">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛍️</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/shop.css">
    {% block extra_head %}{% endblock %}
</head>
<body>

<nav class="navbar">
    <div class="navbar-inner">
        <a href="/" class="logo">Shop<span>Nova</span> ✦</a>
        <ul class="nav-links">
            <li><a href="/" id="nav-home">Home</a></li>
            <li><a href="/shop" id="nav-shop">Shop</a></li>
            <li><a href="/cart" id="nav-cart">Cart</a></li>
        </ul>
        <a href="/cart" class="cart-btn" id="btn-cart-nav">
            🛒 Cart <span class="cart-badge" id="cart-count-badge">{{ cart_count }}</span>
        </a>
    </div>
</nav>

<main>
    {% block content %}{% endblock %}
</main>

<footer class="footer">
    <p>© 2025 <strong>ShopNova</strong> · Built with <a href="#">Node Framework</a> · All rights reserved.</p>
</footer>

{% block extra_scripts %}{% endblock %}

</body>
</html>
